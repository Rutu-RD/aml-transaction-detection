[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "aml_detection"
version = "0.0.1"
description = "Ml pipeline for detecting money laundering topologies"
authors = [
  { name = "Ruturaj Desai" },
]
license = { file = "LICENSE" }
readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License"
]
requires-python = "~=3.11.0"


[tool.ruff]
line-length = 99
src = ["aml_detection"]
include = ["pyproject.toml", "aml_detection/**/*.py"]

[tool.ruff.lint]
extend-select = ["I"]  # Add import sorting

[tool.ruff.lint.isort]
known-first-party = ["aml_detection"]
force-sort-within-sections = true

